# One pipeline per change: merge requests, or branch pushes with no open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  GOPATH: $CI_PROJECT_DIR/.go

.go:
  image: golang:1.26.8
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod/]

test:
  extends: .go
  script:
    - go test -race ./...

lint:
  extends: .go
  # Ships Go 1.26.1 and downloads the go.mod version on its own.
  image: golangci/golangci-lint:v2.11.3
  script:
    - golangci-lint run ./...

vuln:
  extends: .go
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

docker-build:
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -t fizzbuzz .
